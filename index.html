:root, [data-theme="light"] {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.1rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem;
  --space-12: 3rem; --space-16: 4rem;
  --radius-sm: 0.5rem; --radius-md: 0.875rem; --radius-lg: 1.25rem; --radius-xl: 1.75rem; --radius-full: 9999px;
  --color-bg: #f7f6f2;
  --color-surface: #fcfbf8;
  --color-surface-2: #f4f1ec;
  --color-surface-offset: #ede8e1;
  --color-border: rgba(40,37,29,0.12);
  --color-divider: rgba(40,37,29,0.08);
  --color-text: #28251d;
  --color-text-muted: #6f6a63;
  --color-text-faint: #a09a92;
  --color-primary: #0c6f73;
  --color-primary-hover: #09565a;
  --color-primary-soft: rgba(12,111,115,0.1);
  --color-success: #2e6d48;
  --shadow-sm: 0 1px 2px rgba(30, 24, 15, 0.05);
  --shadow-md: 0 12px 28px rgba(30, 24, 15, 0.08);
  --shadow-lg: 0 28px 60px rgba(30, 24, 15, 0.12);
  --font-body: 'Inter', sans-serif;
  --font-display: 'Inter', sans-serif;
}
[data-theme="dark"] {
  --color-bg: #161513;
  --color-surface: #1d1b19;
  --color-surface-2: #252320;
  --color-surface-offset: #2d2a26;
  --color-border: rgba(233,229,222,0.12);
  --color-divider: rgba(233,229,222,0.08);
  --color-text: #ece7df;
  --color-text-muted: #b4aea6;
  --color-text-faint: #7e776f;
  --color-primary: #65aeb4;
  --color-primary-hover: #8fc5ca;
  --color-primary-soft: rgba(101,174,180,0.14);
  --color-success: #7bbb92;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.22);
  --shadow-md: 0 14px 32px rgba(0,0,0,0.26);
  --shadow-lg: 0 30px 60px rgba(0,0,0,0.38);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-bg: #161513;
    --color-surface: #1d1b19;
    --color-surface-2: #252320;
    --color-surface-offset: #2d2a26;
    --color-border: rgba(233,229,222,0.12);
    --color-divider: rgba(233,229,222,0.08);
    --color-text: #ece7df;
    --color-text-muted: #b4aea6;
    --color-text-faint: #7e776f;
    --color-primary: #65aeb4;
    --color-primary-hover: #8fc5ca;
    --color-primary-soft: rgba(101,174,180,0.14);
    --color-success: #7bbb92;
  }
}
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light dark; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background:
    radial-gradient(circle at top left, rgba(12,111,115,0.08), transparent 28%),
    linear-gradient(180deg, var(--color-bg), var(--color-surface-2));
  min-height: 100vh;
  overflow: hidden;
  color: var(--color-text);
  font-size: var(--text-base);
  line-height: 1.6;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
.app-container {
  display: grid;
  grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
  height: 100vh;
  width: 100%;
  overflow: hidden;
}
.sidebar {
  background: color-mix(in srgb, var(--color-surface) 94%, transparent);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  backdrop-filter: blur(16px);
}
.sidebar-header {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: var(--space-8) var(--space-6) var(--space-5);
  background: color-mix(in srgb, var(--color-surface) 94%, transparent);
  border-bottom: 1px solid var(--color-divider);
  backdrop-filter: blur(20px);
}
.main-title {
  font-size: var(--text-lg);
  font-weight: 800;
  color: var(--color-text);
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  line-height: 1.2;
}
.main-title i {
  width: 2.5rem;
  height: 2.5rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--color-primary-soft);
  color: var(--color-primary);
  flex-shrink: 0;
}
.subhead {
  margin-top: var(--space-4);
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  background: var(--color-surface-2);
  border: 1px solid var(--color-divider);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.project-list-container { flex: 1; padding: var(--space-5); }
.project-item {
  background: var(--color-surface);
  margin-bottom: var(--space-4);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  cursor: pointer;
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}
.project-item:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--color-primary) 35%, var(--color-border));
  box-shadow: var(--shadow-md);
}
.project-item.active {
  background: linear-gradient(180deg, color-mix(in srgb, var(--color-primary-soft) 80%, var(--color-surface)), var(--color-surface));
  border-color: color-mix(in srgb, var(--color-primary) 45%, var(--color-border));
  box-shadow: var(--shadow-md);
}
.project-sn, .badge, .badge-women {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.35rem 0.8rem;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.project-sn { background: var(--color-primary-soft); color: var(--color-primary); margin-bottom: var(--space-3); }
.project-idea { font-weight: 750; font-size: 1rem; color: var(--color-text); line-height: 1.35; }
.project-lead {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-top: var(--space-3);
  display: flex;
  gap: var(--space-3);
  align-items: center;
  flex-wrap: wrap;
}
.badge-women { background: rgba(161,44,123,0.1); color: #9b2f76; }
.main-view {
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: transparent;
  position: relative;
}
.top-bar {
  padding: var(--space-5) var(--space-8);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-4);
  background: color-mix(in srgb, var(--color-surface) 84%, transparent);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--color-divider);
}
.institute-badge h2 {
  font-size: clamp(1.15rem, 1rem + 0.8vw, 1.5rem);
  font-weight: 800;
  color: var(--color-text);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  align-items: center;
}
.institute-badge p { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: 0.25rem; }
.action-buttons { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.btn-icon {
  min-height: 44px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  padding: 0.75rem 1rem;
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--color-text);
  transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
}
.btn-icon:hover {
  background: var(--color-surface-2);
  border-color: color-mix(in srgb, var(--color-primary) 35%, var(--color-border));
}
.content-pane {
  flex: 1;
  padding: var(--space-6) var(--space-8) var(--space-8);
  overflow-y: auto;
}
.detail-card {
  background: color-mix(in srgb, var(--color-surface) 98%, transparent);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--color-border);
  margin-bottom: var(--space-6);
  overflow: hidden;
}
.detail-header {
  background: linear-gradient(180deg, color-mix(in srgb, var(--color-primary-soft) 70%, var(--color-surface)), var(--color-surface));
  padding: var(--space-8);
  border-bottom: 1px solid var(--color-divider);
}
.detail-header h1 {
  font-size: clamp(1.6rem, 1.25rem + 1vw, 2.2rem);
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.15;
}
.detail-badges { display: flex; gap: var(--space-3); margin-top: var(--space-4); flex-wrap: wrap; }
.badge { background: var(--color-surface-2); color: var(--color-text-muted); border: 1px solid var(--color-divider); }
.badge-green { background: rgba(46,109,72,0.12); color: var(--color-success); border-color: rgba(46,109,72,0.2); }
.detail-body { padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-5); }
.info-row {
  display: grid;
  grid-template-columns: minmax(150px, 180px) 1fr;
  gap: var(--space-4);
  border-bottom: 1px solid var(--color-divider);
  padding-bottom: var(--space-4);
}
.info-row:last-child { border-bottom: none; padding-bottom: 0; }
.info-label { font-weight: 700; color: var(--color-text-muted); font-size: var(--text-sm); }
.info-value { color: var(--color-text); font-weight: 500; line-height: 1.65; }
.file-preview-section {
  background: var(--color-surface-2);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  border: 1px solid var(--color-border);
}
.file-preview-section h3 {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.file-list { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-bottom: var(--space-5); }
.file-btn {
  min-height: 40px;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);
  padding: 0.65rem 1rem;
  cursor: pointer;
  font-size: var(--text-sm);
  transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
  color: var(--color-text-muted);
}
.file-btn:hover { background: var(--color-surface-offset); border-color: var(--color-primary); }
.file-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
.preview-frame {
  width: 100%;
  height: min(65vh, 720px);
  border-radius: calc(var(--radius-xl) - var(--space-2));
  border: 1px solid var(--color-border);
  background: white;
}
.missing-files {
  background: color-mix(in srgb, #da7101 12%, var(--color-surface));
  padding: var(--space-6);
  border-radius: var(--radius-lg);
  text-align: center;
  color: var(--color-text);
  border: 1px solid color-mix(in srgb, #da7101 18%, var(--color-border));
}
.home-image { display: flex; justify-content: center; margin: var(--space-6) 0; }
.home-image img {
  width: min(100%, 1280px);
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--color-border);
  object-fit: contain;
}
.floating-pill {
  position: fixed;
  bottom: var(--space-5);
  right: var(--space-5);
  background: color-mix(in srgb, var(--color-text) 88%, transparent);
  backdrop-filter: blur(16px);
  color: var(--color-surface);
  padding: 0.65rem 1rem;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 0.02em;
  z-index: 20;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(255,255,255,0.15);
  pointer-events: none;
}
.floating-pill i { margin-right: 0.35rem; color: #ff8f9e; }
.theme-toggle {
  min-width: 44px;
  width: 44px;
  height: 44px;
  display: inline-grid;
  place-items: center;
  padding: 0;
}
@media (max-width: 1100px) {
  .app-container { grid-template-columns: 320px minmax(0, 1fr); }
  .top-bar, .content-pane { padding-inline: var(--space-5); }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  .app-container { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .sidebar { max-height: 42vh; border-right: none; border-bottom: 1px solid var(--color-border); }
  .main-view { min-height: 58vh; }
  .top-bar { flex-direction: column; align-items: flex-start; }
  .action-buttons { width: 100%; }
  .action-buttons .btn-icon { flex: 1; justify-content: center; }
  .info-row { grid-template-columns: 1fr; gap: var(--space-2); }
  .preview-frame { height: 420px; }
}
@media (max-width: 560px) {
  .sidebar-header, .project-list-container, .top-bar, .content-pane, .detail-header, .detail-body, .file-preview-section { padding-left: var(--space-4); padding-right: var(--space-4); }
  .project-item { padding: var(--space-4); border-radius: var(--radius-md); }
  .detail-card, .file-preview-section, .home-image img { border-radius: var(--radius-lg); }
  .floating-pill { left: var(--space-4); right: var(--space-4); bottom: var(--space-4); text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
</style>

        { sn: "12", idea: "Drone Defence", lead: "Ananya", leadContact: "9880848811", teamMembers: "Manjunath, Gopikrishna, Medha, Ananya", teamSize: "4", womenLed: "Yes", sustainability: "Yes", facultyGuide: "Dr.Indravijay Singh", description: "Drone forensic AI for detecting unknown drones." },
        { sn: "13", idea: "CareerPath", lead: "Aishwarya", leadContact: "6362590818", teamMembers: "Chaitanya, Deepa, Safwana", teamSize: "4", womenLed: "Yes", sustainability: "Yes", facultyGuide: "Mrs. Prameela", description: "Predictive analysis for campus placement." },
        { sn: "14", idea: "NexHaul", lead: "Sambram", leadContact: "7204002616", teamMembers: "Shivaraj, Shreyank", teamSize: "3", womenLed: "No", sustainability: "Yes", facultyGuide: "Dept. CSE", description: "Helping truckers find loads and reduce idle time." },
        { sn: "15", idea: "Parkaro", lead: "Niranjan", leadContact: "8217871260", teamMembers: "Prajwal K Sheregar, Jayanth C E", teamSize: "3", womenLed: "No", sustainability: "Yes", facultyGuide: "Dept. CSE", description: "Smart parking geofencing hardware." }
    ];

    const HOME_IMAGE_URL = "https://drive.google.com/thumbnail?id=1wQW-L3n6TjMbX2KxLhiR7SDkbCybbVbf&sz=w2000";
	
    // Helper functions
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Render home screen (welcome with image)
    function renderHomeScreen() {
        const container = document.getElementById("dynamicContentPane");
        container.innerHTML = `
            <div class="detail-card">
                <div class="detail-header">
                    <h1>✨ Innovation Showcase</h1>
                    <div class="detail-badges">
                        <span class="badge"><i class="fas fa-robot"></i> AI & Smart Systems</span>
                        <span class="badge badge-green"><i class="fas fa-seedling"></i> Sustainability Focus</span>
                    </div>
                </div>
                <div class="detail-body">
                    <div class="home-image">
                        <img src="${HOME_IMAGE_URL}" alt="NAIN MITK Innovation Showcase">
                    </div>
                    <div style="text-align: center;">
                        <h3 style="margin: 20px 0 12px;">Top 15 Innovative Ideas</h3>
                        <p style="color: #5F7F97;">Select a project from the left sidebar – you'll see its full details and preview its PPTX/PDF files directly inside this page.</p>
                        <div style="margin-top: 32px;">
                            <i class="fas fa-user-friends"></i> 15+ student teams &nbsp;|&nbsp;
                            <i class="fas fa-female"></i> Women-led initiatives &nbsp;|&nbsp;
                            <i class="fas fa-file-powerpoint"></i> PPTX & PDF previews
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // Render project details with file preview
    function renderProjectDetails(project) {
        const container = document.getElementById("dynamicContentPane");
        if (!container) return;

        const womenBadge = project.womenLed === "Yes" ? '<span class="badge" style="background:#ffe6f0; color:#b33b66;"><i class="fas fa-female"></i> Women Led</span>' : '';
        const sustainBadge = project.sustainability === "Yes" ? '<span class="badge badge-green"><i class="fas fa-leaf"></i> Sustainability Focused</span>' : '';

        const fileIds = PROJECT_FILES[project.sn] || [];
        let fileSection = '';

        if (fileIds.length === 0) {
            fileSection = `
                <div class="file-preview-section">
                    <h3><i class="fas fa-file-alt"></i> Project Files</h3>
                    <div class="missing-files">
                        <i class="fas fa-exclamation-triangle" style="color:#e67e22;"></i>
                        <p style="margin-top:12px;"><strong>No file IDs added yet.</strong><br>
                        Please paste the Google Drive file ID(s) for this project in the <code>PROJECT_FILES</code> object inside the script.</p>
                    </div>
                </div>
            `;
        } else {
            // Create buttons for each file
            let buttonsHtml = '';
            fileIds.forEach((id, idx) => {
                const fileName = `Pitch_Deck ${idx+1}`;
                buttonsHtml += `<button class="file-btn" data-file-id="${id}">📄 ${fileName}</button>`;
            });
            // Preview iframe (first file by default)
            const firstFileId = fileIds[0];
            const previewUrl = `https://drive.google.com/file/d/${firstFileId}/preview`;
            fileSection = `
                <div class="file-preview-section">
                    <h3><i class="fas fa-file-alt"></i> Project Pitch_Deck</h3>
                    <div class="file-list" id="fileList-${project.sn}">
                        ${buttonsHtml}
                    </div>
                    <div>
                        <iframe id="previewFrame-${project.sn}" class="preview-frame" src="${previewUrl}" title="File Preview"></iframe>
                    </div>
                </div>
            `;
        }

        const detailHTML = `
            <div class="detail-card">
                <div class="detail-header">
                    <h1>${escapeHtml(project.idea)}</h1>
                    <div class="detail-badges">
                        <span class="badge"><i class="fas fa-hashtag"></i> Project #${project.sn}</span>
                        ${womenBadge}
                        ${sustainBadge}
                    </div>
                </div>
                <div class="detail-body">
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-align-left"></i> Brief Description</div>
                        <div class="info-value">${escapeHtml(project.description)}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-user-tie"></i> Team Lead</div>
                        <div class="info-value">${escapeHtml(project.lead)} <span style="background:#eef3f9; padding:4px 12px; border-radius:36px;"><i class="fas fa-phone-alt"></i> ${escapeHtml(project.leadContact)}</span></div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-users"></i> Team Members</div>
                        <div class="info-value">${escapeHtml(project.teamMembers)}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-user-friends"></i> Team Size</div>
                        <div class="info-value">${escapeHtml(project.teamSize)} members</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label"><i class="fas fa-chalkboard-user"></i> Faculty Guide(s)</div>
                        <div class="info-value">${escapeHtml(project.facultyGuide)}</div>
                    </div>
                </div>
            </div>
            ${fileSection}
        `;
        container.innerHTML = detailHTML;

        // Attach click handlers for file buttons if any exist
        if (fileIds.length > 0) {
            const buttons = document.querySelectorAll(`#fileList-${project.sn} .file-btn`);
            const iframe = document.getElementById(`previewFrame-${project.sn}`);
            buttons.forEach((btn, idx) => {
                btn.addEventListener('click', () => {
                    const fileId = btn.dataset.fileId;
                    iframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
                // Activate first button by default
                if (idx === 0) btn.classList.add('active');
            });
        }
    }

    // Build sidebar (no auto-selection, just populate list)
    function buildSidebar() {
        const container = document.getElementById("projectListContainer");
        container.innerHTML = "";
        PROJECTS_DATA.forEach(proj => {
            const div = document.createElement("div");
            div.className = "project-item";
            div.innerHTML = `
                <div class="project-sn"><i class="fas fa-list-ol"></i> ${proj.sn}</div>
                <div class="project-idea">${escapeHtml(proj.idea)}</div>
                <div class="project-lead"><i class="fas fa-user-circle"></i> Lead: ${escapeHtml(proj.lead)} 
                ${proj.womenLed === "Yes" ? '<span class="badge-women"><i class="fas fa-venus"></i> Women Led</span>' : ''}</div>
            `;
            div.addEventListener("click", () => {
                // Remove active class from all other items
                document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                renderProjectDetails(proj);
            });
            container.appendChild(div);
        });
        // No default active project – home screen stays visible
    }

    // Reset to home screen and remove any active project highlight
    function resetToHome() {
        renderHomeScreen();
        document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
    }

    // Fullscreen toggle
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.warn(err));
        } else {
            document.exitFullscreen();
        }
    }

    // Initialization: build sidebar and show home screen
    document.addEventListener("DOMContentLoaded", () => {
        buildSidebar();
        renderHomeScreen();  // Start with home screen
        document.getElementById("fullScreenToggleBtn").addEventListener("click", toggleFullscreen);
        document.getElementById("homeResetBtn").addEventListener("click", resetToHome);
    });
</script>
</body>
</html>
